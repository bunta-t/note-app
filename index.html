<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note App</title>
  <style>
    :root {
      color-scheme: light dark;
      --focus-color: #2563eb;
      --focus-bg: #dbeafe;
      --border-color: #ccc;
      --danger-color: #b91c1c;
      --link-color: #5b21b6;
      --tag-color: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 1.125rem;
      line-height: 1.6;
      margin: 0;
      padding: 1.5rem;
    }

    /* 一覧画面は読みやすい行長を保つため幅を制限する。
       編集画面・一覧画面とも2〜3カラム化時により広い幅を使うため、独自に幅を持たせる。 */
    #view-list {
      max-width: 720px;
      margin-inline: auto;
    }

    /* 画面幅が十分な場合のみタグサイドバーを左に並べる2カラム化。
       狭い場合はタグ→ノート一覧の順で縦積みのまま(DOM順どおり)。 */
    @media (min-width: 1024px) {
      #view-list {
        max-width: 1100px;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
        grid-template-areas:
          "heading heading"
          "tags    notes";
        gap: 1.5rem;
        align-items: start;
      }

      /* hidden 属性より display:grid が常に勝ってしまわないよう、
         非表示でない時だけ grid を適用する(#view-editor と同じ対策)。 */
      #view-list:not([hidden]) {
        display: grid;
      }

      #list-heading {
        grid-area: heading;
      }

      .tags-sidebar {
        grid-area: tags;
      }

      .note-list-area {
        grid-area: notes;
      }
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 4px solid var(--focus-color);
      outline-offset: 3px;
    }

    /* 入力欄は文字が読めることを優先し、背景色は変えず枠線のみ強調する */
    button:focus-visible,
    summary:focus-visible {
      background-color: var(--focus-bg);
    }

    #new-note-btn {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border: 2px solid var(--focus-color);
      border-radius: 6px;
      background: #fff;
      color: var(--focus-color);
      font-weight: bold;
    }

    #note-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .note-item {
      display: flex;
      gap: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .note-open-btn {
      flex: 1;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
    }

    .note-title {
      font-weight: bold;
    }

    .note-updated {
      font-size: 0.9rem;
      color: #555;
    }

    .note-delete-btn {
      padding: 0.75rem 1rem;
      border: none;
      border-left: 1px solid var(--border-color);
      background: transparent;
      color: var(--danger-color);
    }

    .tags-sidebar {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      background: #f7f7f7;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 1024px) {
      .tags-sidebar {
        margin-bottom: 0;
      }
    }

    .tags-sidebar h2 {
      font-size: 1.1rem;
      margin: 0 0 0.75rem;
    }

    #clear-tags-btn {
      display: block;
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #tag-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #tag-list li {
      margin-bottom: 0.4rem;
    }

    .tag-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    /* 選択状態はフォーカスの青と区別できるよう別系統の色(--link-color)を使う */
    .tag-btn-selected {
      background: var(--link-color);
      color: #fff;
      border-color: var(--link-color);
      font-weight: bold;
    }

    #view-editor {
      max-width: 720px;
      margin-inline: auto;
      grid-template-columns: 1fr;
      grid-template-areas:
        "back"
        "heading"
        "title"
        "related"
        "body";
      gap: 1.5rem;
    }

    #view-editor:not([hidden]) {
      display: grid;
    }

    /* 画面幅が十分な場合のみ3カラム化(左は将来のサイドバー用の空き列)。
       拡大表示で実効幅が狭くなった場合は自然に縦積みへ戻る。
       左列は最小限の固定幅、右列(関連ノート)は見出しが折り返さない幅を
       minmax() で確保し、中央(本文)に残りの幅を割り当てる。 */
    @media (min-width: 1024px) {
      #view-editor {
        max-width: 1100px;
        grid-template-columns: 96px minmax(0, 1fr) minmax(280px, 360px);
        grid-template-areas:
          "back    back    back"
          "heading heading heading"
          "sidebar title   related"
          "sidebar body    related";
      }
    }

    #back-btn {
      grid-area: back;
      justify-self: start;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #editor-heading {
      grid-area: heading;
    }

    /* 将来のタグ機能サイドバー用に予約した空き列。中身は今回は追加しない */
    .editor-sidebar {
      display: none;
    }

    @media (min-width: 1024px) {
      .editor-sidebar {
        display: block;
        grid-area: sidebar;
      }
    }

    #title-field {
      grid-area: title;
    }

    #body-field {
      grid-area: body;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-weight: bold;
    }

    #title-input {
      font: inherit;
      padding: 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    /* 本文欄(CodeMirror)。.cm-editor は既定スタイルの優先度が低いため、
       通常のセレクタでそのまま上書きできる。 */
    .cm-editor {
      width: 100%;
      font: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .cm-content {
      min-height: 50vh;
      padding: 0.6rem;
    }

    .cm-editor.cm-focused {
      outline: 4px solid var(--focus-color);
      outline-offset: 3px;
      /* 入力欄は文字が読めることを優先し、背景色は変えない方針を踏襲 */
    }

    .link-highlight {
      color: var(--link-color);
      text-decoration: underline;
    }

    .tag-highlight {
      color: var(--tag-color);
      text-decoration: underline;
    }

    /* [[ / :: のサジェストポップアップ。本文と同じ18px以上のフォントを継承する。 */
    .cm-tooltip-autocomplete {
      font: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .cm-tooltip-autocomplete ul li[aria-selected] {
      background: var(--focus-color);
      color: #fff;
    }

    .related-section {
      grid-area: related;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      background: #f7f7f7;
    }

    .related-section h2 {
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
    }

    .related-section details {
      margin-top: 0.75rem;
    }

    .related-section summary {
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      padding: 0.25rem 0;
    }

    .related-section ul {
      list-style: none;
      margin: 0.5rem 0 0;
      padding: 0;
    }

    .related-section li {
      margin-bottom: 0.4rem;
    }

    .note-link {
      display: inline-block;
      color: var(--link-color);
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0.3rem 0.2rem;
      font: inherit;
      cursor: pointer;
    }

    dialog {
      border: none;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .dialog-actions button {
      padding: 0.6rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #delete-confirm-btn {
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --focus-bg: transparent;
        --link-color: #c4b5fd;
        --tag-color: #86efac;
      }

      body {
        background: #111;
        color: #eee;
      }

      #new-note-btn,
      #back-btn,
      dialog,
      .dialog-actions button,
      #title-input,
      .cm-editor,
      .cm-tooltip-autocomplete,
      .related-section,
      .tags-sidebar,
      #clear-tags-btn,
      .tag-btn {
        background: #1c1c1c;
        color: #eee;
        border-color: #444;
      }

      /* .tag-btn と同じ詳細度のため、選択状態を保つには後ろで再度上書きする */
      .tag-btn-selected {
        background: var(--link-color);
        color: #1c1c1c;
        border-color: var(--link-color);
      }

      .note-item {
        border-color: #444;
      }

      .note-delete-btn {
        border-left-color: #444;
      }

      .note-updated {
        color: #aaa;
      }
    }
  </style>
</head>
<body>
  <div id="live-region" class="visually-hidden" aria-live="polite"></div>

  <main>
    <section id="view-list" aria-labelledby="list-heading">
      <h1 id="list-heading">Notes</h1>

      <aside aria-labelledby="tags-heading" class="tags-sidebar">
        <h2 id="tags-heading">タグ</h2>
        <button id="clear-tags-btn" type="button">全て表示</button>
        <ul id="tag-list"></ul>
      </aside>

      <div class="note-list-area">
        <button id="new-note-btn" type="button">新規ノート</button>
        <ul id="note-list"></ul>
      </div>
    </section>

    <section id="view-editor" aria-labelledby="editor-heading" hidden>
      <button id="back-btn" type="button">一覧に戻る</button>
      <h1 id="editor-heading">ノート編集</h1>

      <aside class="editor-sidebar" aria-hidden="true"></aside>

      <div class="field" id="title-field">
        <label for="title-input">タイトル</label>
        <input id="title-input" type="text">
      </div>

      <div class="field" id="body-field">
        <label id="body-label">本文</label>
        <div id="body-editor"></div>
      </div>

      <section aria-labelledby="related-heading" class="related-section">
        <h2 id="related-heading">関連ノート</h2>
        <p id="related-empty-message" hidden>関連ノートはありません</p>
        <details id="outgoing-details" open>
          <summary>参照しているノート</summary>
          <ul id="outgoing-list"></ul>
        </details>
        <details id="backlinks-details" open>
          <summary>参照されているノート(backlinks)</summary>
          <ul id="backlinks-list"></ul>
        </details>
      </section>
    </section>
  </main>

  <dialog id="delete-dialog" aria-labelledby="delete-dialog-heading">
    <h2 id="delete-dialog-heading">ノートを削除しますか?</h2>
    <p id="delete-dialog-message"></p>
    <div class="dialog-actions">
      <button id="delete-cancel-btn" type="button" autofocus>キャンセル</button>
      <button id="delete-confirm-btn" type="button">削除する</button>
    </div>
  </dialog>

  <script type="module">
    // CodeMirror 6 を esm.sh 経由でCDN読み込みする。
    // ?deps=... は、複数の import URL 間で @codemirror/state / @codemirror/view / @codemirror/language の
    // バージョンがズレて二重に読み込まれる既知の問題(instanceofが壊れる)を防ぐための指定。
    import { EditorView, minimalSetup } from 'https://esm.sh/codemirror@6.0.2?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.6,@codemirror/language@6.12.4';
    import { EditorState } from 'https://esm.sh/@codemirror/state@6.7.1';
    import { Decoration, ViewPlugin, MatchDecorator } from 'https://esm.sh/@codemirror/view@6.43.6?deps=@codemirror/state@6.7.1';
    import { autocompletion, completionStatus } from 'https://esm.sh/@codemirror/autocomplete@6.20.3?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.6,@codemirror/language@6.12.4';
    // Fuse.js: サジェスト候補のあいまい一致(文字列類似度)判定に使う
    import Fuse from 'https://esm.sh/fuse.js@7.5.0';

    const STORAGE_KEY = 'note-app:notes';

    let notes = [];
    let currentNoteId = null;
    let deleteTargetId = null;
    let selectedTags = [];

    const liveRegion = document.getElementById('live-region');
    const listView = document.getElementById('view-list');
    const editorView = document.getElementById('view-editor');
    const noteListEl = document.getElementById('note-list');
    const newNoteBtn = document.getElementById('new-note-btn');
    const backBtn = document.getElementById('back-btn');
    const titleInput = document.getElementById('title-input');
    const deleteDialog = document.getElementById('delete-dialog');
    const deleteMessageEl = document.getElementById('delete-dialog-message');
    const deleteCancelBtn = document.getElementById('delete-cancel-btn');
    const deleteConfirmBtn = document.getElementById('delete-confirm-btn');
    const relatedEmptyMessage = document.getElementById('related-empty-message');
    const outgoingDetails = document.getElementById('outgoing-details');
    const outgoingListEl = document.getElementById('outgoing-list');
    const backlinksDetails = document.getElementById('backlinks-details');
    const backlinksListEl = document.getElementById('backlinks-list');
    const tagListEl = document.getElementById('tag-list');
    const clearTagsBtn = document.getElementById('clear-tags-btn');

    // --- 本文エディタ(CodeMirror) -------------------------------------

    // [[ノート名]] を装飾するプラグイン。extractLinkTitles と同じ正規表現を使い、
    // 「ハイライトされる範囲」と「実際にリンクとして解決される範囲」を一致させる。
    const linkMark = Decoration.mark({ class: 'link-highlight' });
    const linkMatcher = new MatchDecorator({
      regexp: /\[\[([^\[\]]+)\]\]/g,
      decoration: () => linkMark,
    });
    const linkHighlightPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = linkMatcher.createDeco(view);
      }
      update(update) {
        // update(ViewUpdate) は直前の状態からの変更内容を表す不変オブジェクト。
        // 差分だけを見て装飾範囲を更新するので、毎回本文全体を舐め直さない。
        this.decorations = linkMatcher.updateDeco(update, this.decorations);
      }
    }, { decorations: (instance) => instance.decorations });

    // ::タグ名:: を装飾するプラグイン。extractTags と同じ正規表現を使う。
    const tagMark = Decoration.mark({ class: 'tag-highlight' });
    const tagMatcher = new MatchDecorator({
      regexp: /::(.+?)::/g,
      decoration: () => tagMark,
    });
    const tagHighlightPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = tagMatcher.createDeco(view);
      }
      update(update) {
        this.decorations = tagMatcher.updateDeco(update, this.decorations);
      }
    }, { decorations: (instance) => instance.decorations });

    // --- サジェスト候補(Fuse.js) -------------------------------------

    let linkFuse = null;
    let linkSuggestionItems = [];
    let tagFuse = null;
    let tagSuggestionItems = [];

    // notes配列が変わるたびに呼び直し、サジェスト用のFuseインスタンスを作り直す。
    function rebuildSuggestionSources() {
      linkSuggestionItems = notes.map((note) => ({
        id: note.id,
        title: note.title.trim() === '' ? '無題' : note.title,
        citationCount: getCitationCount(note, notes),
      }));
      // threshold: 0.4 ・・・ 0(完全一致のみ)〜1(何でも一致)の目盛りで、
      // タイトルの一部だけ覚えている入力や軽微なタイポは拾いつつ、無関係な候補が
      // 上位5件を占領しないよう、既定値0.6よりやや厳しめに設定する。
      // ignoreLocation: true ・・・ 既定では文字列の先頭付近の一致を優遇するが、
      // タイトルの途中や末尾の断片を入力するケースもあるため位置による優遇を無効化する。
      linkFuse = new Fuse(linkSuggestionItems, { keys: ['title'], threshold: 0.4, ignoreLocation: true });

      tagSuggestionItems = getAllTagsWithCounts(notes); // 既存関数を再利用(使用頻度順ソート済み)
      tagFuse = new Fuse(tagSuggestionItems, { keys: ['name'], threshold: 0.4, ignoreLocation: true });
    }

    // Fuse.js はあくまで候補の絞り込みだけに使い、最終的な並び順は引用数で決め直す。
    // 編集中の自分自身のノートは、自分自身へのリンクを除外する既存方針(getOutgoingNotes)と揃え、候補から外す。
    function getLinkSuggestions(query) {
      const candidates = query.trim() === ''
        ? [...linkSuggestionItems]
        : linkFuse.search(query).map((r) => r.item);
      return candidates
        .filter((item) => item.id !== currentNoteId)
        .sort((a, b) => b.citationCount - a.citationCount)
        .slice(0, 5);
    }

    // 最終的な並び順は使用頻度(count)で決め直す。
    function getTagSuggestions(query) {
      const candidates = query.trim() === ''
        ? [...tagSuggestionItems]
        : tagFuse.search(query).map((r) => r.item);
      return candidates
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);
    }

    // [[ の直後を補完する CompletionSource。
    // matchBefore は「カーソル直前がこの正規表現にマッチするか」を調べる CodeMirror のAPI。
    // [[ の後ろに [ や ] を含まない文字列が続き、それがカーソル位置まで連続している状態を検出する。
    function linkCompletionSource(context) {
      const match = context.matchBefore(/\[\[([^\[\]]*)$/);
      if (!match) {
        return null;
      }
      const query = match.text.slice(2); // "[[" の分を除いた入力済み文字列
      const from = match.from + 2;
      const candidates = getLinkSuggestions(query);
      if (candidates.length === 0) {
        return null; // 候補0件ならポップアップを出さない
      }
      return {
        from,
        to: context.pos,
        options: candidates.map((item) => ({
          label: item.title,
          apply: (view, completion, applyFrom, applyTo) => {
            // 選択した候補名 + "]]" を挿入し、カーソルを "]]" の直後に置く
            const insertText = `${item.title}]]`;
            view.dispatch({
              changes: { from: applyFrom, to: applyTo, insert: insertText },
              selection: { anchor: applyFrom + insertText.length },
            });
          },
        })),
      };
    }

    // :: の直後を補完する CompletionSource(考え方はリンク側と同じ)。
    function tagCompletionSource(context) {
      const match = context.matchBefore(/::([^:]*)$/);
      if (!match) {
        return null;
      }
      const query = match.text.slice(2);
      const from = match.from + 2;
      const candidates = getTagSuggestions(query);
      if (candidates.length === 0) {
        return null;
      }
      return {
        from,
        to: context.pos,
        options: candidates.map((item) => ({
          label: item.name,
          apply: (view, completion, applyFrom, applyTo) => {
            const insertText = `${item.name}::`;
            view.dispatch({
              changes: { from: applyFrom, to: applyTo, insert: insertText },
              selection: { anchor: applyFrom + insertText.length },
            });
          },
        })),
      };
    }

    const bodyExtensions = [
      minimalSetup,
      EditorView.lineWrapping, // textarea同様、長い行を折り返す(CodeMirrorは既定では折り返さない)
      linkHighlightPlugin,
      tagHighlightPlugin,
      // override で、この2つのソースだけが候補を出すようにする
      autocompletion({ override: [linkCompletionSource, tagCompletionSource] }),
      EditorView.contentAttributes.of({ 'aria-labelledby': 'body-label' }),
      EditorView.updateListener.of((update) => {
        // docChanged: このトランザクションで本文が変わったかどうか。
        // 既存の handleEditorInput() をそのまま呼ぶことで、自動保存・関連ノート再計算の
        // 呼び出し経路は既存のtextarea版から一切変えない。
        if (update.docChanged) {
          handleEditorInput();
        }
      }),
    ];

    const bodyView = new EditorView({
      state: EditorState.create({ doc: '', extensions: bodyExtensions }),
      parent: document.getElementById('body-editor'),
    });

    function setBodyContent(text) {
      bodyView.setState(EditorState.create({ doc: text, extensions: bodyExtensions }));
    }

    // --- データ層 -------------------------------------------------

    function loadNotes() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return [];
      }
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveNotes(notesToSave) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notesToSave));
    }

    function sortByUpdatedDesc(list) {
      return [...list].sort((a, b) => b.updatedAt - a.updatedAt);
    }

    function extractLinkTitles(text) {
      const pattern = /\[\[([^\[\]]+)\]\]/g;
      const titles = [];
      let match;
      while ((match = pattern.exec(text)) !== null) {
        titles.push(match[1].trim());
      }
      return titles;
    }

    function findNoteByTitle(title, allNotes) {
      return allNotes.find((n) => n.title.trim() === title);
    }

    function getOutgoingNotes(note, allNotes) {
      const linkedTitles = extractLinkTitles(note.body);
      const result = [];
      const seenIds = new Set();
      linkedTitles.forEach((title) => {
        const target = findNoteByTitle(title, allNotes);
        if (target && target.id !== note.id && !seenIds.has(target.id)) {
          seenIds.add(target.id);
          result.push(target);
        }
      });
      return result;
    }

    function getBacklinkNotes(note, allNotes) {
      return allNotes.filter((other) => {
        if (other.id === note.id) {
          return false;
        }
        return getOutgoingNotes(other, allNotes).some((n) => n.id === note.id);
      });
    }

    // 引用数 = 他の全ノートの本文中に [[このノートのタイトル]] が出現する回数の合計(自分自身は除く)。
    // getBacklinkNotes と同じ「他ノートの本文をパースして参照を探す」考え方を使うが、
    // ノート単位ではなく出現回数そのものを数える(サジェストの並び順に使う)。
    function getCitationCount(note, allNotes) {
      let count = 0;
      allNotes.forEach((other) => {
        if (other.id === note.id) {
          return;
        }
        count += extractLinkTitles(other.body).filter((title) => title === note.title.trim()).length;
      });
      return count;
    }

    function extractTags(text) {
      const pattern = /::(.+?)::/g;
      const tags = [];
      let match;
      while ((match = pattern.exec(text)) !== null) {
        const trimmed = match[1].trim();
        if (trimmed !== '') {
          tags.push(trimmed);
        }
      }
      return tags;
    }

    function getAllTagsWithCounts(allNotes) {
      const counts = new Map();
      allNotes.forEach((note) => {
        const tagsInNote = new Set(extractTags(note.body));
        tagsInNote.forEach((tag) => {
          counts.set(tag, (counts.get(tag) || 0) + 1);
        });
      });
      return [...counts.entries()]
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => b.count - a.count);
    }

    function filterNotesByTags(notesToFilter, selectedTagNames) {
      if (selectedTagNames.length === 0) {
        return notesToFilter;
      }
      return notesToFilter.filter((note) => {
        const noteTags = new Set(extractTags(note.body));
        return selectedTagNames.every((tag) => noteTags.has(tag));
      });
    }

    // --- 共通 -----------------------------------------------------

    function showView(viewName) {
      const showList = viewName === 'list';
      listView.hidden = !showList;
      editorView.hidden = showList;
    }

    function announce(message) {
      // 直前と同じ文言でも読み上げられるよう、一度空にしてから設定する
      liveRegion.textContent = '';
      window.setTimeout(() => {
        liveRegion.textContent = message;
      }, 50);
    }

    function formatDateTime(timestamp) {
      const date = new Date(timestamp);
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // --- 一覧画面 ---------------------------------------------------

    function getVisibleNotes() {
      const filtered = filterNotesByTags(notes, selectedTags);
      return sortByUpdatedDesc(filtered);
    }

    function renderNoteList() {
      const visible = getVisibleNotes();
      noteListEl.innerHTML = '';

      visible.forEach((note) => {
        const titleText = note.title.trim() === '' ? '無題' : note.title;

        const li = document.createElement('li');
        li.className = 'note-item';

        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'note-open-btn';
        openBtn.dataset.id = note.id;

        const titleSpan = document.createElement('span');
        titleSpan.className = 'note-title';
        titleSpan.textContent = titleText;

        const updatedSpan = document.createElement('span');
        updatedSpan.className = 'note-updated';
        updatedSpan.textContent = `更新: ${formatDateTime(note.updatedAt)}`;

        openBtn.appendChild(titleSpan);
        openBtn.appendChild(updatedSpan);

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'note-delete-btn';
        deleteBtn.dataset.id = note.id;
        deleteBtn.setAttribute('aria-label', `「${titleText}」を削除`);
        deleteBtn.textContent = '削除';

        li.appendChild(openBtn);
        li.appendChild(deleteBtn);
        noteListEl.appendChild(li);
      });
    }

    function renderTagList() {
      const tagsWithCounts = getAllTagsWithCounts(notes);
      const availableTagNames = tagsWithCounts.map((t) => t.name);

      // ノートの編集・削除でノート側から消えたタグは選択状態からも外す
      selectedTags = selectedTags.filter((t) => availableTagNames.includes(t));

      tagListEl.innerHTML = '';
      tagsWithCounts.forEach(({ name, count }) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tag-btn';
        btn.dataset.name = name;
        const isSelected = selectedTags.includes(name);
        btn.setAttribute('aria-pressed', String(isSelected));
        if (isSelected) {
          btn.classList.add('tag-btn-selected');
        }
        btn.textContent = `${name} (${count})`;
        btn.addEventListener('click', () => toggleTag(name));
        li.appendChild(btn);
        tagListEl.appendChild(li);
      });
    }

    function focusTagButton(name) {
      const btn = tagListEl.querySelector(`.tag-btn[data-name="${CSS.escape(name)}"]`);
      if (btn) {
        btn.focus();
      }
    }

    function announceFilterState() {
      if (selectedTags.length === 0) {
        announce(`絞り込みを解除しました、${notes.length}件`);
        return;
      }
      const visibleCount = getVisibleNotes().length;
      announce(`${selectedTags.join('と')}で絞り込み中、${visibleCount}件`);
    }

    function toggleTag(name) {
      const index = selectedTags.indexOf(name);
      if (index === -1) {
        selectedTags.push(name);
      } else {
        selectedTags.splice(index, 1);
      }
      renderTagList();
      renderNoteList();
      focusTagButton(name);
      announceFilterState();
    }

    function renderListView() {
      renderTagList();
      renderNoteList();
    }

    function focusFirstListItem() {
      const firstBtn = noteListEl.querySelector('.note-open-btn');
      if (firstBtn) {
        firstBtn.focus();
      } else {
        newNoteBtn.focus();
      }
    }

    function focusListItem(noteId) {
      const btn = noteListEl.querySelector(`.note-open-btn[data-id="${noteId}"]`);
      if (btn) {
        btn.focus();
      } else {
        focusFirstListItem();
      }
    }

    function focusAfterDelete(deletedIndex) {
      const items = noteListEl.querySelectorAll('.note-open-btn');
      if (items.length === 0) {
        newNoteBtn.focus();
        return;
      }
      const targetIndex = Math.min(deletedIndex, items.length - 1);
      items[targetIndex].focus();
    }

    function handleNewNoteClick() {
      const newNote = {
        id: crypto.randomUUID(),
        title: '',
        body: '',
        updatedAt: Date.now(),
      };
      notes.push(newNote);
      saveNotes(notes);
      rebuildSuggestionSources();
      renderListView();
      openEditor(newNote.id);
    }

    function handleDeleteClick(noteId) {
      const note = notes.find((n) => n.id === noteId);
      if (!note) {
        return;
      }
      const titleText = note.title.trim() === '' ? '無題' : note.title;
      deleteTargetId = noteId;
      deleteMessageEl.textContent = `「${titleText}」を削除します。この操作は元に戻せません。`;
      deleteDialog.showModal();
    }

    function handleConfirmDelete() {
      const visible = getVisibleNotes();
      const deletedIndex = visible.findIndex((n) => n.id === deleteTargetId);
      const deletedNote = visible[deletedIndex];

      deleteDialog.close();

      notes = notes.filter((n) => n.id !== deleteTargetId);
      saveNotes(notes);
      rebuildSuggestionSources();
      renderListView();
      focusAfterDelete(deletedIndex);
      announce(`「${deletedNote.title.trim() === '' ? '無題' : deletedNote.title}」を削除しました`);
    }

    // --- 編集画面 ---------------------------------------------------

    function createNoteLinkButton(note) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'note-link';
      btn.textContent = note.title.trim() === '' ? '無題' : note.title;
      btn.addEventListener('click', () => openEditor(note.id));
      li.appendChild(btn);
      return li;
    }

    function renderRelatedNotes() {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note) {
        return;
      }

      const outgoing = getOutgoingNotes(note, notes);
      outgoingListEl.innerHTML = '';
      outgoing.forEach((n) => outgoingListEl.appendChild(createNoteLinkButton(n)));
      outgoingDetails.hidden = outgoing.length === 0;
      outgoingDetails.querySelector('summary').textContent = `参照しているノート (${outgoing.length})`;

      const backlinks = getBacklinkNotes(note, notes);
      backlinksListEl.innerHTML = '';
      backlinks.forEach((n) => backlinksListEl.appendChild(createNoteLinkButton(n)));
      backlinksDetails.hidden = backlinks.length === 0;
      backlinksDetails.querySelector('summary').textContent = `参照されているノート(backlinks) (${backlinks.length})`;

      relatedEmptyMessage.hidden = outgoing.length > 0 || backlinks.length > 0;
    }

    function resolveDuplicateTitle(noteId) {
      const note = notes.find((n) => n.id === noteId);
      if (!note) {
        return false;
      }

      const trimmedTitle = note.title.trim();
      const baseTitle = trimmedTitle === '' ? '無題' : trimmedTitle;
      const isDuplicate = notes.some((n) => n.id !== note.id && n.title.trim() === baseTitle);

      // タイトルが空でなく、かつ重複もなければ何もしない
      if (trimmedTitle !== '' && !isDuplicate) {
        return false;
      }

      let finalTitle = baseTitle;
      if (isDuplicate) {
        let counter = 1;
        let candidate;
        do {
          candidate = `${baseTitle}_${String(counter).padStart(2, '0')}`;
          counter += 1;
        } while (notes.some((n) => n.id !== note.id && n.title.trim() === candidate));
        finalTitle = candidate;
      }

      note.title = finalTitle;
      note.updatedAt = Date.now();
      saveNotes(notes);
      rebuildSuggestionSources();
      if (noteId === currentNoteId) {
        titleInput.value = finalTitle;
        renderRelatedNotes();
      }
      announce(isDuplicate
        ? `タイトルが重複していたため「${finalTitle}」に設定しました`
        : `タイトルを「${finalTitle}」に設定しました`);
      return true;
    }

    function openEditor(noteId) {
      const note = notes.find((n) => n.id === noteId);
      if (!note) {
        return;
      }
      if (currentNoteId && currentNoteId !== noteId) {
        resolveDuplicateTitle(currentNoteId);
      }
      currentNoteId = noteId;
      titleInput.value = note.title;
      setBodyContent(note.body);
      renderRelatedNotes();
      showView('editor');
      titleInput.focus();
    }

    function closeEditor() {
      const noteId = currentNoteId;
      resolveDuplicateTitle(noteId);
      currentNoteId = null;
      renderListView();
      showView('list');
      focusListItem(noteId);
    }

    function handleEditorInput() {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note) {
        return;
      }
      note.title = titleInput.value;
      note.body = bodyView.state.doc.toString();
      note.updatedAt = Date.now();
      saveNotes(notes);
      rebuildSuggestionSources();
      renderRelatedNotes();
    }

    function handleExplicitSave() {
      handleEditorInput();
      const renamed = resolveDuplicateTitle(currentNoteId);
      if (!renamed) {
        announce('保存しました');
      }
    }

    // --- イベント登録 -------------------------------------------------

    newNoteBtn.addEventListener('click', handleNewNoteClick);
    backBtn.addEventListener('click', closeEditor);
    clearTagsBtn.addEventListener('click', () => {
      selectedTags = [];
      renderTagList();
      renderNoteList();
      announceFilterState();
    });
    titleInput.addEventListener('input', handleEditorInput);
    // 本文側の入力検知は bodyExtensions 内の EditorView.updateListener が担う

    noteListEl.addEventListener('click', (event) => {
      const openBtn = event.target.closest('.note-open-btn');
      if (openBtn) {
        openEditor(openBtn.dataset.id);
        return;
      }
      const deleteBtn = event.target.closest('.note-delete-btn');
      if (deleteBtn) {
        handleDeleteClick(deleteBtn.dataset.id);
      }
    });

    deleteCancelBtn.addEventListener('click', () => {
      deleteDialog.close();
    });
    deleteConfirmBtn.addEventListener('click', handleConfirmDelete);
    deleteDialog.addEventListener('close', () => {
      deleteTargetId = null;
    });

    document.addEventListener('keydown', (event) => {
      if (deleteDialog.open) {
        // ダイアログ表示中は <dialog> 標準のフォーカストラップ・Escape挙動に任せる
        return;
      }
      if (event.key === 'Escape' && completionStatus(bodyView.state) != null) {
        // 候補ポップアップ表示中の Escape は CodeMirror 側の closeCompletion に任せ、
        // 編集画面ごと閉じてしまわないようにする
        return;
      }
      if (event.key === 'Escape' && !editorView.hidden) {
        closeEditor();
      } else if (event.ctrlKey && event.key.toLowerCase() === 's') {
        if (!editorView.hidden) {
          event.preventDefault();
          handleExplicitSave();
        }
      }
    });

    // --- 初期化 ---------------------------------------------------

    function init() {
      notes = loadNotes();
      rebuildSuggestionSources();
      renderListView();
      focusFirstListItem();
    }

    init();
  </script>
</body>
</html>
