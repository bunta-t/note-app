<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note App</title>
  <style>
    :root {
      color-scheme: light dark;
      --focus-color: #2563eb;
      --focus-bg: #dbeafe;
      --border-color: #ccc;
      --danger-color: #b91c1c;
      --link-color: #5b21b6;
      --tag-color: #166534;
      --code-bg: #eee;
      --external-link-color: #0e7490;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 1.125rem;
      line-height: 1.6;
      margin: 0;
      padding: 1.5rem;
    }

    /* 一覧画面は読みやすい行長を保つため幅を制限する。
       編集画面・一覧画面とも2〜3カラム化時により広い幅を使うため、独自に幅を持たせる。 */
    #view-list {
      max-width: 720px;
      margin-inline: auto;
    }

    /* 画面幅が十分な場合のみタグサイドバーを左に並べる2カラム化。
       狭い場合はタグ→ノート一覧の順で縦積みのまま(DOM順どおり)。 */
    @media (min-width: 1024px) {
      #view-list {
        max-width: 1100px;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
        grid-template-areas:
          "heading heading"
          "tags    notes";
        gap: 1.5rem;
        align-items: start;
      }

      /* hidden 属性より display:grid が常に勝ってしまわないよう、
         非表示でない時だけ grid を適用する(#view-editor と同じ対策)。 */
      #view-list:not([hidden]) {
        display: grid;
      }

      #list-heading,
      #overview-open-btn {
        grid-area: heading;
      }

      .tags-sidebar {
        grid-area: tags;
      }

      .note-list-area {
        grid-area: notes;
      }
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 4px solid var(--focus-color);
      outline-offset: 3px;
    }

    /* 入力欄は文字が読めることを優先し、背景色は変えず枠線のみ強調する */
    button:focus-visible,
    summary:focus-visible {
      background-color: var(--focus-bg);
    }

    #new-note-btn {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border: 2px solid var(--focus-color);
      border-radius: 6px;
      background: #fff;
      color: var(--focus-color);
      font-weight: bold;
    }

    #overview-open-btn {
      display: block;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #note-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .note-item {
      display: flex;
      gap: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .note-open-btn {
      flex: 1;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
    }

    .note-title {
      font-weight: bold;
    }

    .note-updated {
      font-size: 0.9rem;
      color: #555;
    }

    .note-delete-btn {
      padding: 0.75rem 1rem;
      border: none;
      border-left: 1px solid var(--border-color);
      background: transparent;
      color: var(--danger-color);
    }

    .tags-sidebar {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      background: #f7f7f7;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 1024px) {
      .tags-sidebar {
        margin-bottom: 0;
      }
    }

    .tags-sidebar h2 {
      font-size: 1.1rem;
      margin: 0 0 0.75rem;
    }

    #clear-tags-btn {
      display: block;
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #tag-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #tag-list li {
      margin-bottom: 0.4rem;
    }

    .tag-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    /* 選択状態はフォーカスの青と区別できるよう別系統の色(--link-color)を使う */
    .tag-btn-selected {
      background: var(--link-color);
      color: #fff;
      border-color: var(--link-color);
      font-weight: bold;
    }

    #view-editor {
      max-width: 720px;
      margin-inline: auto;
      grid-template-columns: 1fr;
      grid-template-areas:
        "back"
        "heading"
        "title"
        "related"
        "body";
      gap: 1.5rem;
    }

    #view-editor:not([hidden]) {
      display: grid;
    }

    /* 画面幅が十分な場合のみ3カラム化(左は将来のサイドバー用の空き列)。
       拡大表示で実効幅が狭くなった場合は自然に縦積みへ戻る。
       左列は最小限の固定幅、右列(関連ノート)は見出しが折り返さない幅を
       minmax() で確保し、中央(本文)に残りの幅を割り当てる。 */
    @media (min-width: 1024px) {
      #view-editor {
        max-width: 1100px;
        grid-template-columns: 96px minmax(0, 1fr) minmax(280px, 360px);
        grid-template-areas:
          "back    back    back"
          "heading heading heading"
          "sidebar title   related"
          "sidebar body    related";
      }
    }

    #back-btn {
      grid-area: back;
      justify-self: start;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #editor-heading {
      grid-area: heading;
    }

    /* 将来のタグ機能サイドバー用に予約した空き列。中身は今回は追加しない */
    .editor-sidebar {
      display: none;
    }

    @media (min-width: 1024px) {
      .editor-sidebar {
        display: block;
        grid-area: sidebar;
      }
    }

    #title-field {
      grid-area: title;
    }

    #body-field {
      grid-area: body;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-weight: bold;
    }

    #title-input {
      font: inherit;
      padding: 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    /* 本文欄(CodeMirror)。.cm-editor は既定スタイルの優先度が低いため、
       通常のセレクタでそのまま上書きできる。 */
    .cm-editor {
      width: 100%;
      font: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .cm-content {
      min-height: 50vh;
      padding: 0.6rem;
    }

    .cm-editor.cm-focused {
      outline: 4px solid var(--focus-color);
      outline-offset: 3px;
      /* 入力欄は文字が読めることを優先し、背景色は変えない方針を踏襲 */
    }

    .link-highlight {
      color: var(--link-color);
      text-decoration: underline;
    }

    .tag-highlight {
      color: var(--tag-color);
      text-decoration: underline;
    }

    /* Markdown装飾 */
    .md-bold { font-weight: bold; }
    .md-italic { font-style: italic; }

    .md-code {
      font-family: ui-monospace, monospace;
      background: var(--code-bg);
      padding: 0.1em 0.3em;
      border-radius: 4px;
    }

    .md-blockquote {
      border-left: 4px solid var(--border-color);
      padding-left: 0.75rem;
      color: #555;
    }

    .md-heading-1 { font-size: 1.5em; font-weight: bold; }
    .md-heading-2 { font-size: 1.3em; font-weight: bold; }
    .md-heading-3 { font-size: 1.15em; font-weight: bold; }

    .md-list-marker { font-weight: bold; }

    .md-fold-toggle {
      border: none;
      background: none;
      cursor: pointer;
      padding: 0 0.3em;
      font-size: 0.9em;
    }

    .md-checkbox input {
      width: 1.2em;
      height: 1.2em;
      margin-right: 0.3em;
      vertical-align: middle;
    }

    .md-external-link {
      color: var(--external-link-color);
      text-decoration: underline;
      cursor: pointer;
    }

    /* [[ / :: のサジェストポップアップ。本文と同じ18px以上のフォントを継承する。 */
    .cm-tooltip-autocomplete {
      font: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .cm-tooltip-autocomplete ul li[aria-selected] {
      background: var(--focus-color);
      color: #fff;
    }

    .related-section {
      grid-area: related;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      background: #f7f7f7;
    }

    .related-section h2 {
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
    }

    .related-section details {
      margin-top: 0.75rem;
    }

    .related-section summary {
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      padding: 0.25rem 0;
    }

    .related-section ul {
      list-style: none;
      margin: 0.5rem 0 0;
      padding: 0;
    }

    .related-section li {
      margin-bottom: 0.4rem;
    }

    .note-link {
      display: inline-block;
      color: var(--link-color);
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0.3rem 0.2rem;
      font: inherit;
      cursor: pointer;
    }

    dialog {
      border: none;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .dialog-actions button {
      padding: 0.6rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
    }

    #delete-confirm-btn {
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    #overview-dialog {
      max-width: 640px;
      width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
    }

    #overview-dialog section {
      margin-top: 1.25rem;
    }

    #overview-dialog h3 {
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
    }

    #overview-dialog ul {
      list-style: none;
      margin: 0.5rem 0 0;
      padding: 0;
    }

    #overview-dialog li {
      margin-bottom: 0.4rem;
    }

    .hub-note {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .hub-note details {
      flex: 1;
    }

    .hub-note summary {
      cursor: pointer;
      font-weight: bold;
    }

    .hub-note ul {
      margin-left: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --focus-bg: transparent;
        --link-color: #c4b5fd;
        --tag-color: #86efac;
        --code-bg: #2a2a2a;
        --external-link-color: #67e8f9;
      }

      body {
        background: #111;
        color: #eee;
      }

      #new-note-btn,
      #overview-open-btn,
      #back-btn,
      dialog,
      .dialog-actions button,
      #title-input,
      .cm-editor,
      .cm-tooltip-autocomplete,
      .related-section,
      .tags-sidebar,
      #clear-tags-btn,
      .tag-btn {
        background: #1c1c1c;
        color: #eee;
        border-color: #444;
      }

      /* .tag-btn と同じ詳細度のため、選択状態を保つには後ろで再度上書きする */
      .tag-btn-selected {
        background: var(--link-color);
        color: #1c1c1c;
        border-color: var(--link-color);
      }

      .note-item {
        border-color: #444;
      }

      .note-delete-btn {
        border-left-color: #444;
      }

      .note-updated {
        color: #aaa;
      }

      .md-blockquote {
        color: #aaa;
      }
    }
  </style>
</head>
<body>
  <div id="live-region" class="visually-hidden" aria-live="polite"></div>

  <main>
    <section id="view-list" aria-labelledby="list-heading">
      <h1 id="list-heading">Notes</h1>
      <button id="overview-open-btn" type="button">ノート俯瞰を表示</button>

      <aside aria-labelledby="tags-heading" class="tags-sidebar">
        <h2 id="tags-heading">タグ</h2>
        <button id="clear-tags-btn" type="button">全て表示</button>
        <ul id="tag-list"></ul>
      </aside>

      <div class="note-list-area">
        <button id="new-note-btn" type="button">新規ノート</button>
        <ul id="note-list"></ul>
      </div>
    </section>

    <section id="view-editor" aria-labelledby="editor-heading" hidden>
      <button id="back-btn" type="button">一覧に戻る</button>
      <h1 id="editor-heading">ノート編集</h1>

      <aside class="editor-sidebar" aria-hidden="true"></aside>

      <div class="field" id="title-field">
        <label for="title-input">タイトル</label>
        <input id="title-input" type="text">
      </div>

      <div class="field" id="body-field">
        <label id="body-label">本文</label>
        <div id="body-editor"></div>
      </div>

      <section aria-labelledby="related-heading" class="related-section">
        <h2 id="related-heading">関連ノート</h2>
        <p id="related-empty-message" hidden>関連ノートはありません</p>
        <details id="outgoing-details" open>
          <summary>参照しているノート</summary>
          <ul id="outgoing-list"></ul>
        </details>
        <details id="backlinks-details" open>
          <summary>参照されているノート(backlinks)</summary>
          <ul id="backlinks-list"></ul>
        </details>
      </section>
    </section>
  </main>

  <dialog id="delete-dialog" aria-labelledby="delete-dialog-heading">
    <h2 id="delete-dialog-heading">ノートを削除しますか?</h2>
    <p id="delete-dialog-message"></p>
    <div class="dialog-actions">
      <button id="delete-cancel-btn" type="button" autofocus>キャンセル</button>
      <button id="delete-confirm-btn" type="button">削除する</button>
    </div>
  </dialog>

  <dialog id="overview-dialog" aria-labelledby="overview-dialog-heading">
    <h2 id="overview-dialog-heading">ノート俯瞰</h2>
    <button id="overview-close-btn" type="button" autofocus aria-label="閉じる">✕</button>

    <section aria-labelledby="overview-stats-heading">
      <h3 id="overview-stats-heading">全体統計</h3>
      <p id="overview-stats-text"></p>
    </section>

    <section aria-labelledby="overview-recent-heading">
      <h3 id="overview-recent-heading">最近の作業</h3>
      <ul id="overview-recent-list"></ul>
    </section>

    <section aria-labelledby="overview-hubs-heading">
      <h3 id="overview-hubs-heading">ハブノートとタグクラスタ</h3>
      <div id="overview-hubs-container"></div>
    </section>

    <section aria-labelledby="overview-potential-heading">
      <h3 id="overview-potential-heading">潜在リンク候補</h3>
      <ul id="overview-potential-list"></ul>
    </section>

    <section aria-labelledby="overview-isolated-heading">
      <h3 id="overview-isolated-heading">孤立ノート</h3>
      <p id="overview-isolated-count"></p>
      <ul id="overview-isolated-list"></ul>
    </section>
  </dialog>

  <script type="module">
    // CodeMirror 6 を esm.sh 経由でCDN読み込みする。
    // ?deps=... は、複数の import URL 間で @codemirror/state / @codemirror/view / @codemirror/language の
    // バージョンがズレて二重に読み込まれる既知の問題(instanceofが壊れる)を防ぐための指定。
    import { EditorView, minimalSetup } from 'https://esm.sh/codemirror@6.0.2?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.6,@codemirror/language@6.12.4';
    import { EditorState, RangeSetBuilder } from 'https://esm.sh/@codemirror/state@6.7.1';
    import { Decoration, ViewPlugin, MatchDecorator, WidgetType, keymap } from 'https://esm.sh/@codemirror/view@6.43.6?deps=@codemirror/state@6.7.1';
    import { autocompletion, completionStatus } from 'https://esm.sh/@codemirror/autocomplete@6.20.3?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.6,@codemirror/language@6.12.4';
    // 見出し折りたたみ用(@codemirror/language の fold API)
    import {
      foldService,
      codeFolding,
      foldable,
      foldEffect,
      unfoldEffect,
      foldedRanges,
    } from 'https://esm.sh/@codemirror/language@6.12.4?deps=@codemirror/state@6.7.1,@codemirror/view@6.43.6';
    // Fuse.js: サジェスト候補のあいまい一致(文字列類似度)判定に使う
    import Fuse from 'https://esm.sh/fuse.js@7.5.0';

    const STORAGE_KEY = 'note-app:notes';

    let notes = [];
    let currentNoteId = null;
    let deleteTargetId = null;
    let selectedTags = [];

    const liveRegion = document.getElementById('live-region');
    const listView = document.getElementById('view-list');
    const editorView = document.getElementById('view-editor');
    const noteListEl = document.getElementById('note-list');
    const newNoteBtn = document.getElementById('new-note-btn');
    const backBtn = document.getElementById('back-btn');
    const titleInput = document.getElementById('title-input');
    const deleteDialog = document.getElementById('delete-dialog');
    const deleteMessageEl = document.getElementById('delete-dialog-message');
    const deleteCancelBtn = document.getElementById('delete-cancel-btn');
    const deleteConfirmBtn = document.getElementById('delete-confirm-btn');
    const relatedEmptyMessage = document.getElementById('related-empty-message');
    const outgoingDetails = document.getElementById('outgoing-details');
    const outgoingListEl = document.getElementById('outgoing-list');
    const backlinksDetails = document.getElementById('backlinks-details');
    const backlinksListEl = document.getElementById('backlinks-list');
    const tagListEl = document.getElementById('tag-list');
    const clearTagsBtn = document.getElementById('clear-tags-btn');
    const overviewOpenBtn = document.getElementById('overview-open-btn');
    const overviewDialog = document.getElementById('overview-dialog');
    const overviewCloseBtn = document.getElementById('overview-close-btn');
    const overviewStatsText = document.getElementById('overview-stats-text');
    const overviewRecentList = document.getElementById('overview-recent-list');
    const overviewHubsContainer = document.getElementById('overview-hubs-container');
    const overviewPotentialList = document.getElementById('overview-potential-list');
    const overviewIsolatedCount = document.getElementById('overview-isolated-count');
    const overviewIsolatedList = document.getElementById('overview-isolated-list');

    // --- 本文エディタ(CodeMirror) -------------------------------------

    // [[ノート名]] を装飾するプラグイン。extractLinkTitles と同じ正規表現を使い、
    // 「ハイライトされる範囲」と「実際にリンクとして解決される範囲」を一致させる。
    const linkMark = Decoration.mark({ class: 'link-highlight' });
    const linkMatcher = new MatchDecorator({
      regexp: /\[\[([^\[\]]+)\]\]/g,
      decoration: () => linkMark,
    });
    const linkHighlightPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = linkMatcher.createDeco(view);
      }
      update(update) {
        // update(ViewUpdate) は直前の状態からの変更内容を表す不変オブジェクト。
        // 差分だけを見て装飾範囲を更新するので、毎回本文全体を舐め直さない。
        this.decorations = linkMatcher.updateDeco(update, this.decorations);
      }
    }, { decorations: (instance) => instance.decorations });

    // ::タグ名:: を装飾するプラグイン。extractTags と同じ正規表現を使う。
    const tagMark = Decoration.mark({ class: 'tag-highlight' });
    const tagMatcher = new MatchDecorator({
      regexp: /::(.+?)::/g,
      decoration: () => tagMark,
    });
    const tagHighlightPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = tagMatcher.createDeco(view);
      }
      update(update) {
        this.decorations = tagMatcher.updateDeco(update, this.decorations);
      }
    }, { decorations: (instance) => instance.decorations });

    // --- Markdown装飾(インライン記法) -------------------------------

    // 記号部分(**, *, `)を Decoration.replace({}) で非表示にし、中身だけを
    // Decoration.mark で装飾する共通ヘルパー。MatchDecorator は「マッチ全体」に
    // 1つの装飾しか付けられないため、記号と中身で別々の装飾を作るには手動で
    // RangeSetBuilder を組み立てる(外部リンクの実装と同じ考え方)。
    function buildDelimitedDecorations(view, pattern, markerLength, className) {
      const builder = new RangeSetBuilder();
      for (const { from, to } of view.visibleRanges) {
        const text = view.state.doc.sliceString(from, to);
        pattern.lastIndex = 0;
        let match;
        while ((match = pattern.exec(text))) {
          const start = from + match.index;
          const contentStart = start + markerLength;
          const contentEnd = contentStart + match[1].length;
          const end = contentEnd + markerLength;
          builder.add(start, contentStart, Decoration.replace({}));
          builder.add(contentStart, contentEnd, Decoration.mark({ class: className }));
          builder.add(contentEnd, end, Decoration.replace({}));
        }
      }
      return builder.finish();
    }

    function makeDelimitedPlugin(pattern, markerLength, className) {
      return ViewPlugin.fromClass(class {
        constructor(view) {
          this.decorations = buildDelimitedDecorations(view, pattern, markerLength, className);
        }
        update(update) {
          if (update.docChanged || update.viewportChanged) {
            this.decorations = buildDelimitedDecorations(update.view, pattern, markerLength, className);
          }
        }
      }, { decorations: (instance) => instance.decorations });
    }

    // 太字 **text**(記号2文字ぶんを隠す)
    const boldPlugin = makeDelimitedPlugin(/\*\*([^*]+)\*\*/g, 2, 'md-bold');

    // 斜体 *text*(記号1文字ぶんを隠す。直前直後がもう1つの * ではないことを
    // 否定先読み/後読みで確認し、**bold** の内側を誤って斜体と判定しないようにする)
    const italicPlugin = makeDelimitedPlugin(/(?<!\*)\*(?!\*)([^*]+)(?<!\*)\*(?!\*)/g, 1, 'md-italic');

    // インラインコード `code`(記号1文字ぶんを隠す)
    const codePlugin = makeDelimitedPlugin(/`([^`]+)`/g, 1, 'md-code');

    // --- Markdown装飾(外部リンク) -----------------------------------

    // 外部リンク [表示テキスト](URL) の "表示テキスト" 部分だけを装飾する。
    // マッチ全体ではなく表示テキスト部分の位置を計算する必要があるため、
    // MatchDecorator ではなく手動でRangeSetBuilderを組み立てる。
    const externalLinkPattern = /\[([^\[\]]+)\]\(([^()]+)\)/g;

    function buildExternalLinkDecorations(view) {
      const builder = new RangeSetBuilder();
      for (const { from, to } of view.visibleRanges) {
        const text = view.state.doc.sliceString(from, to);
        externalLinkPattern.lastIndex = 0;
        let match;
        while ((match = externalLinkPattern.exec(text))) {
          const label = match[1];
          const url = match[2];
          const labelStart = from + match.index + 1; // "[" の次から
          const labelEnd = labelStart + label.length;
          const matchEnd = from + match.index + match[0].length; // [表示テキスト](URL) 全体の直後
          builder.add(labelStart, labelEnd, Decoration.mark({
            class: 'md-external-link',
            tagName: 'span',
            attributes: {
              tabindex: '0',
              role: 'link',
              'aria-label': `(${label})、新しいタブで開きます`,
              'data-url': url,
              'data-end': String(matchEnd),
            },
          }));
        }
      }
      return builder.finish();
    }

    function openExternalLink(view, target) {
      // noopener,noreferrer: 新しいタブから元のページ(window.opener)を
      // 操作されないようにするための安全策(タブナビング対策)
      window.open(target.dataset.url, '_blank', 'noopener,noreferrer');
      // 操作後はフォーカスがリンク要素(<span tabindex="0">)に移りCodeMirrorの
      // カーソルが見えなくなるため、リンク全体の直後にカーソルを戻し
      // エディタへフォーカスを戻す。
      view.dispatch({ selection: { anchor: Number(target.dataset.end) } });
      view.focus();
    }

    const externalLinkPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = buildExternalLinkDecorations(view);
      }
      update(update) {
        if (update.docChanged || update.viewportChanged) {
          this.decorations = buildExternalLinkDecorations(update.view);
        }
      }
    }, {
      decorations: (instance) => instance.decorations,
      eventHandlers: {
        click(event, view) {
          const target = event.target.closest('.md-external-link');
          if (target) {
            openExternalLink(view, target);
          }
        },
        // Enterキーでの操作は handleEditorEnter(document.activeElementを直接調べる
        // キーマップコマンド)で行う。理由は handleEditorEnter の定義コメントを参照。
      },
    });

    // --- Markdown装飾(行単位の記法: 見出し・引用・リスト・チェックボックス) ---

    function matchHeading(lineText) {
      return /^(#{1,3})\s+/.exec(lineText); // レベルはグループ1の文字数(1〜3)
    }
    function matchCheckbox(lineText) {
      return /^-\s+\[([ xX])\]\s?/.exec(lineText);
    }
    function matchBullet(lineText) {
      return /^-\s+/.exec(lineText);
    }
    function matchNumbered(lineText) {
      return /^(\d+)(\.)\s+/.exec(lineText); // 仕様の "1. item" 形式のみ対応
    }
    function matchBlockquote(lineText) {
      return /^>\s?/.exec(lineText);
    }

    // 折りたたみ済みかどうかを調べる。foldedRanges(state) はCM6が管理する
    // 「現在折りたたまれている範囲」のDecorationSetで、between()で該当位置を調べられる。
    function getFoldedRange(state, line) {
      let found = null;
      foldedRanges(state).between(line.to, line.to, (from, to) => {
        found = { from, to };
        return false; // 見つかったら走査を打ち切る
      });
      return found;
    }

    // チェックボックス用ウィジェット。公式ドキュメントのチェックボックス例と同じ構成:
    // 実体の <input type="checkbox"> を <span> で包む(Firefoxがcontenteditable内の
    // チェックボックスを正しく扱えないための回避策)。
    class CheckboxWidget extends WidgetType {
      constructor(checked) {
        super();
        this.checked = checked;
      }
      eq(other) {
        return other.checked === this.checked;
      }
      toDOM() {
        const wrap = document.createElement('span');
        wrap.className = 'md-checkbox';
        const box = wrap.appendChild(document.createElement('input'));
        box.type = 'checkbox';
        box.checked = this.checked;
        box.setAttribute('aria-label', this.checked ? 'チェック済み' : '未チェック');
        return wrap;
      }
      ignoreEvent() {
        return false; // falseにすることでクリック/キー操作をCodeMirrorに奪われず処理できる
      }
    }

    // 見出し折りたたみトグル用ウィジェット。実体の <button> なので既存の
    // :focus-visible / button:focus-visible がそのまま効き、Tab到達・Enter/Space操作も
    // 追加コードなしで満たせる。
    class FoldToggleWidget extends WidgetType {
      constructor(folded) {
        super();
        this.folded = folded;
      }
      eq(other) {
        return other.folded === this.folded;
      }
      toDOM() {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'md-fold-toggle';
        btn.textContent = this.folded ? '▶' : '▼';
        btn.setAttribute('aria-label', this.folded ? '見出しを展開' : '見出しを折りたたむ');
        return btn;
      }
      ignoreEvent() {
        return false;
      }
    }

    function buildMarkdownBlockDecorations(view) {
      const builder = new RangeSetBuilder();
      const { state } = view;
      for (const { from, to } of view.visibleRanges) {
        let pos = from;
        while (pos <= to) {
          const line = state.doc.lineAt(pos);
          const headingMatch = matchHeading(line.text);
          const checkboxMatch = !headingMatch && matchCheckbox(line.text);
          const bulletMatch = !headingMatch && !checkboxMatch && matchBullet(line.text);
          const numberedMatch = !headingMatch && !checkboxMatch && !bulletMatch && matchNumbered(line.text);
          const blockquoteMatch = !headingMatch && !checkboxMatch && !bulletMatch && !numberedMatch && matchBlockquote(line.text);

          if (headingMatch) {
            const level = headingMatch[1].length;
            const markerLength = headingMatch[0].length; // "# " や "### " の長さ
            const foldedRange = getFoldedRange(state, line);
            builder.add(line.from, line.from, Decoration.widget({ widget: new FoldToggleWidget(Boolean(foldedRange)), side: -1 }));
            builder.add(line.from, line.from + markerLength, Decoration.replace({}));
            builder.add(line.from + markerLength, line.to, Decoration.mark({ class: `md-heading md-heading-${level}` }));
          } else if (checkboxMatch) {
            const bracketStart = line.from + checkboxMatch[0].indexOf('[');
            const bracketEnd = bracketStart + 3; // "[ ]" / "[x]" は3文字
            const checked = checkboxMatch[1].toLowerCase() === 'x';
            builder.add(bracketStart, bracketEnd, Decoration.replace({ widget: new CheckboxWidget(checked) }));
          } else if (bulletMatch) {
            builder.add(line.from, line.from + bulletMatch[0].length, Decoration.mark({ class: 'md-list-marker' }));
          } else if (numberedMatch) {
            builder.add(line.from, line.from + numberedMatch[0].length, Decoration.mark({ class: 'md-list-marker' }));
          } else if (blockquoteMatch) {
            builder.add(line.from, line.from, Decoration.line({ class: 'md-blockquote' }));
          }

          pos = line.to + 1;
        }
      }
      return builder.finish();
    }

    function toggleHeadingFold(view, line) {
      const foldedRange = getFoldedRange(view.state, line);
      let effect = null;
      if (foldedRange) {
        effect = unfoldEffect.of(foldedRange);
      } else {
        const range = foldable(view.state, line.from, line.to); // 登録した foldService が呼ばれる
        if (range) {
          effect = foldEffect.of(range);
        }
      }
      // 操作後はフォーカスがトグルボタン(<button>)に移りCodeMirrorのカーソルが
      // 見えなくなるため、操作した見出し行の末尾にカーソルを戻し、
      // エディタへフォーカスを戻す。
      view.dispatch(effect ? { effects: effect, selection: { anchor: line.to } } : { selection: { anchor: line.to } });
      view.focus();
    }

    function toggleCheckbox(view, pos) {
      const line = view.state.doc.lineAt(pos);
      const match = matchCheckbox(line.text);
      if (!match) {
        view.focus();
        return;
      }
      const bracketStart = line.from + match[0].indexOf('[');
      const checked = match[1].toLowerCase() === 'x';
      // 操作後はフォーカスがチェックボックス(<input>)に移りCodeMirrorのカーソルが
      // 見えなくなるため、操作した行の末尾にカーソルを戻し、エディタへフォーカスを戻す。
      view.dispatch({
        changes: { from: bracketStart + 1, to: bracketStart + 2, insert: checked ? ' ' : 'x' },
        selection: { anchor: line.to },
      });
      view.focus();
    }

    const markdownBlockPlugin = ViewPlugin.fromClass(class {
      constructor(view) {
        this.decorations = buildMarkdownBlockDecorations(view);
      }
      update(update) {
        // 折りたたみはドキュメントの文字自体を変えないため、docChanged だけでなく
        // fold/unfold のエフェクトが流れたときも装飾(トグルの矢印表示)を作り直す。
        const foldChanged = update.transactions.some((tr) => tr.effects.some((e) => e.is(foldEffect) || e.is(unfoldEffect)));
        if (update.docChanged || update.viewportChanged || foldChanged) {
          this.decorations = buildMarkdownBlockDecorations(update.view);
        }
      }
    }, {
      decorations: (instance) => instance.decorations,
      eventHandlers: {
        click(event, view) {
          if (event.target.tagName === 'INPUT' && event.target.closest('.md-checkbox')) {
            toggleCheckbox(view, view.posAtDOM(event.target));
            return;
          }
          const foldBtn = event.target.closest('.md-fold-toggle');
          if (foldBtn) {
            const line = view.state.doc.lineAt(view.posAtDOM(foldBtn));
            toggleHeadingFold(view, line);
          }
        },
        // Enterキーでの操作は handleEditorEnter(document.activeElementを直接調べる
        // キーマップコマンド)で行う。理由は handleEditorEnter の定義コメントを参照。
      },
    });

    // 見出しの折りたたみ範囲を決めるfoldService。
    // state.doc.lineAt(lineStart) で行を取り出し、見出し行なら「次の同レベル以上の
    // 見出し行の手前まで」を折りたたみ範囲として返す。見出しでない、または
    // 折りたたむ内容が無ければ null を返す(foldServiceの仕様)。
    function headingFoldService(state, lineStart) {
      const line = state.doc.lineAt(lineStart);
      const match = matchHeading(line.text);
      if (!match) {
        return null;
      }
      const level = match[1].length;
      let scan = line;
      while (scan.number < state.doc.lines) {
        scan = state.doc.line(scan.number + 1);
        const nextMatch = matchHeading(scan.text);
        if (nextMatch && nextMatch[1].length <= level) {
          const prevLine = state.doc.line(scan.number - 1);
          return prevLine.to > line.to ? { from: line.to, to: prevLine.to } : null;
        }
      }
      return state.doc.length > line.to ? { from: line.to, to: state.doc.length } : null;
    }

    // --- Markdownリストの Enter 自動継続 -------------------------------

    // Enterキーの独自コマンド。リスト行の末尾でなければ false を返し、通常のEnter処理に
    // フォールバックする(CodeMirrorのキーマップは、コマンドが false を返すと次の
    // キーバインドを試す仕組みになっている)。
    function handleListEnter(view) {
      const { state } = view;
      const pos = state.selection.main.head;
      const line = state.doc.lineAt(pos);
      if (pos !== line.to || !state.selection.main.empty) {
        return false; // 行末で選択なしの場合のみ扱う
      }

      const checkboxMatch = matchCheckbox(line.text);
      const bulletMatch = !checkboxMatch && matchBullet(line.text);
      const numberedMatch = !checkboxMatch && !bulletMatch && matchNumbered(line.text);

      if (checkboxMatch) {
        const rest = line.text.slice(checkboxMatch[0].length);
        if (rest.trim() === '') {
          view.dispatch({ changes: { from: line.from, to: line.to, insert: '' } });
          return true;
        }
        view.dispatch({ changes: { from: pos, insert: '\n- [ ] ' }, selection: { anchor: pos + 7 } });
        return true;
      }
      if (bulletMatch) {
        const rest = line.text.slice(bulletMatch[0].length);
        if (rest.trim() === '') {
          view.dispatch({ changes: { from: line.from, to: line.to, insert: '' } });
          return true;
        }
        view.dispatch({ changes: { from: pos, insert: '\n- ' }, selection: { anchor: pos + 3 } });
        return true;
      }
      if (numberedMatch) {
        const rest = line.text.slice(numberedMatch[0].length);
        if (rest.trim() === '') {
          view.dispatch({ changes: { from: line.from, to: line.to, insert: '' } });
          return true;
        }
        const marker = `${Number(numberedMatch[1]) + 1}${numberedMatch[2]} `;
        view.dispatch({ changes: { from: pos, insert: `\n${marker}` }, selection: { anchor: pos + 1 + marker.length } });
        return true;
      }
      return false;
    }

    // Enterキーの入り口となるコマンド。折りたたみトグル・チェックボックス・外部リンクは
    // それぞれ独立したDOM要素(<button>/<input>/tabindex付きの<span>)にキーボード
    // フォーカスが乗るが、CodeMirrorの本文カーソル位置(state.selection)はそれとは
    // 連動しない。そのため「今どの要素にキーボードフォーカスがあるか」を
    // document.activeElement で直接調べ、該当すればそれぞれのトグル処理を行って
    // true を返す(true を返すとCodeMirrorはこのキー入力を「処理済み」とみなし、
    // 既定のEnter処理(改行)を行わない)。該当しなければ通常通り handleListEnter に
    // 処理を委ねる。
    // 補足: このコマンドは bodyExtensions の先頭近くに置く必要がある。CodeMirrorは
    // keymap/eventHandlers を拡張の並び順で優先度づけするため、後ろの方に書いた
    // 処理(以前はここを markdownBlockPlugin 側の eventHandlers.keydown に書いていた)
    // は、先に並ぶ既定のEnterキーマップに処理を奪われ、実行されないことがある。
    function handleEditorEnter(view) {
      const active = document.activeElement;
      if (active) {
        if (active.classList.contains('md-fold-toggle')) {
          const line = view.state.doc.lineAt(view.posAtDOM(active));
          toggleHeadingFold(view, line);
          return true;
        }
        if (active.tagName === 'INPUT' && active.closest('.md-checkbox')) {
          toggleCheckbox(view, view.posAtDOM(active));
          return true;
        }
        if (active.classList.contains('md-external-link')) {
          openExternalLink(view, active);
          return true;
        }
      }
      return handleListEnter(view);
    }

    // --- サジェスト候補(Fuse.js) -------------------------------------

    let linkFuse = null;
    let linkSuggestionItems = [];
    let tagFuse = null;
    let tagSuggestionItems = [];

    // notes配列が変わるたびに呼び直し、サジェスト用のFuseインスタンスを作り直す。
    function rebuildSuggestionSources() {
      linkSuggestionItems = notes.map((note) => ({
        id: note.id,
        title: note.title.trim() === '' ? '無題' : note.title,
        citationCount: getCitationCount(note, notes),
      }));
      // threshold: 0.4 ・・・ 0(完全一致のみ)〜1(何でも一致)の目盛りで、
      // タイトルの一部だけ覚えている入力や軽微なタイポは拾いつつ、無関係な候補が
      // 上位5件を占領しないよう、既定値0.6よりやや厳しめに設定する。
      // ignoreLocation: true ・・・ 既定では文字列の先頭付近の一致を優遇するが、
      // タイトルの途中や末尾の断片を入力するケースもあるため位置による優遇を無効化する。
      linkFuse = new Fuse(linkSuggestionItems, { keys: ['title'], threshold: 0.4, ignoreLocation: true });

      tagSuggestionItems = getAllTagsWithCounts(notes); // 既存関数を再利用(使用頻度順ソート済み)
      tagFuse = new Fuse(tagSuggestionItems, { keys: ['name'], threshold: 0.4, ignoreLocation: true });
    }

    // Fuse.js はあくまで候補の絞り込みだけに使い、最終的な並び順は引用数で決め直す。
    // 編集中の自分自身のノートは、自分自身へのリンクを除外する既存方針(getOutgoingNotes)と揃え、候補から外す。
    function getLinkSuggestions(query) {
      const candidates = query.trim() === ''
        ? [...linkSuggestionItems]
        : linkFuse.search(query).map((r) => r.item);
      return candidates
        .filter((item) => item.id !== currentNoteId)
        .sort((a, b) => b.citationCount - a.citationCount)
        .slice(0, 5);
    }

    // 最終的な並び順は使用頻度(count)で決め直す。
    function getTagSuggestions(query) {
      const candidates = query.trim() === ''
        ? [...tagSuggestionItems]
        : tagFuse.search(query).map((r) => r.item);
      return candidates
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);
    }

    // [[ の直後を補完する CompletionSource。
    // matchBefore は「カーソル直前がこの正規表現にマッチするか」を調べる CodeMirror のAPI。
    // [[ の後ろに [ や ] を含まない文字列が続き、それがカーソル位置まで連続している状態を検出する。
    function linkCompletionSource(context) {
      const match = context.matchBefore(/\[\[([^\[\]]*)$/);
      if (!match) {
        return null;
      }
      const query = match.text.slice(2); // "[[" の分を除いた入力済み文字列
      const from = match.from + 2;
      const candidates = getLinkSuggestions(query);
      if (candidates.length === 0) {
        return null; // 候補0件ならポップアップを出さない
      }
      return {
        from,
        to: context.pos,
        options: candidates.map((item) => ({
          label: item.title,
          apply: (view, completion, applyFrom, applyTo) => {
            // 選択した候補名 + "]]" を挿入し、カーソルを "]]" の直後に置く
            const insertText = `${item.title}]]`;
            view.dispatch({
              changes: { from: applyFrom, to: applyTo, insert: insertText },
              selection: { anchor: applyFrom + insertText.length },
            });
          },
        })),
      };
    }

    // :: の直後を補完する CompletionSource(考え方はリンク側と同じ)。
    function tagCompletionSource(context) {
      const match = context.matchBefore(/::([^:]*)$/);
      if (!match) {
        return null;
      }

      // このマッチした "::" が「新しいタグの開始」なのか、直前のタグの「閉じマーカー」
      // なのかを判定する。:: は開始・終了で同じ文字列のため区別が付きにくいので、
      // 同じ行内の、このマッチより前にある "::" の出現回数を数える。
      // 例: "これは::機械学習::と::深層学習" でカーソルが末尾にあるとき、マッチしたのは
      // "深層学習"の前の"::"。その前方には"::機械学習::"で"::"が2個(偶数)あり、
      // 閉じられたペアが揃っているので、今回の"::"は新しい開始マーカーと判断できる。
      // 逆に "これは::機械学習::" で末尾にカーソルがあるとき、末尾の"::"がマッチし、
      // その前方には"::"が1個(奇数)しかなく、開いたままの開始マーカーが1つ残っている
      // ということは、今回マッチした"::"はその「閉じマーカー」だと判断できる。
      const lineStart = context.state.doc.lineAt(match.from).from;
      const textBeforeMatch = context.state.doc.sliceString(lineStart, match.from);
      const colonPairCount = (textBeforeMatch.match(/::/g) || []).length;
      if (colonPairCount % 2 === 1) {
        return null; // 閉じマーカーの直後なのでサジェストを出さない
      }

      const query = match.text.slice(2);
      const from = match.from + 2;
      const candidates = getTagSuggestions(query);
      if (candidates.length === 0) {
        return null;
      }
      return {
        from,
        to: context.pos,
        options: candidates.map((item) => ({
          label: item.name,
          apply: (view, completion, applyFrom, applyTo) => {
            const insertText = `${item.name}::`;
            view.dispatch({
              changes: { from: applyFrom, to: applyTo, insert: insertText },
              selection: { anchor: applyFrom + insertText.length },
            });
          },
        })),
      };
    }

    const bodyExtensions = [
      // Enterキーバインドは minimalSetup より前に置き、既定のEnter処理
      // (insertNewlineAndIndent、minimalSetup内のキーマップにある)より先に試させる。
      // サジェスト機能の autocompletion() は内部で Prec.highest を使いEnterを最優先で
      // 奪う設計なので、配列内の順序に関わらず候補表示中はそちらが先に処理される。
      keymap.of([{ key: 'Enter', run: handleEditorEnter }]),
      minimalSetup,
      EditorView.lineWrapping, // textarea同様、長い行を折り返す(CodeMirrorは既定では折り返さない)
      linkHighlightPlugin,
      tagHighlightPlugin,
      boldPlugin,
      italicPlugin,
      codePlugin,
      externalLinkPlugin,
      markdownBlockPlugin,
      foldService.of(headingFoldService),
      codeFolding(),
      // override で、この2つのソースだけが候補を出すようにする
      autocompletion({ override: [linkCompletionSource, tagCompletionSource] }),
      EditorView.contentAttributes.of({ 'aria-labelledby': 'body-label' }),
      EditorView.updateListener.of((update) => {
        // docChanged: このトランザクションで本文が変わったかどうか。
        // 既存の handleEditorInput() をそのまま呼ぶことで、自動保存・関連ノート再計算の
        // 呼び出し経路は既存のtextarea版から一切変えない。
        if (update.docChanged) {
          handleEditorInput();
        }
      }),
    ];

    const bodyView = new EditorView({
      state: EditorState.create({ doc: '', extensions: bodyExtensions }),
      parent: document.getElementById('body-editor'),
    });

    function setBodyContent(text) {
      bodyView.setState(EditorState.create({ doc: text, extensions: bodyExtensions }));
    }

    // --- データ層 -------------------------------------------------

    function loadNotes() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return [];
      }
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveNotes(notesToSave) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notesToSave));
    }

    function sortByUpdatedDesc(list) {
      return [...list].sort((a, b) => b.updatedAt - a.updatedAt);
    }

    function extractLinkTitles(text) {
      const pattern = /\[\[([^\[\]]+)\]\]/g;
      const titles = [];
      let match;
      while ((match = pattern.exec(text)) !== null) {
        titles.push(match[1].trim());
      }
      return titles;
    }

    function findNoteByTitle(title, allNotes) {
      return allNotes.find((n) => n.title.trim() === title);
    }

    function getOutgoingNotes(note, allNotes) {
      const linkedTitles = extractLinkTitles(note.body);
      const result = [];
      const seenIds = new Set();
      linkedTitles.forEach((title) => {
        const target = findNoteByTitle(title, allNotes);
        if (target && target.id !== note.id && !seenIds.has(target.id)) {
          seenIds.add(target.id);
          result.push(target);
        }
      });
      return result;
    }

    function getBacklinkNotes(note, allNotes) {
      return allNotes.filter((other) => {
        if (other.id === note.id) {
          return false;
        }
        return getOutgoingNotes(other, allNotes).some((n) => n.id === note.id);
      });
    }

    // 引用数 = 他の全ノートの本文中に [[このノートのタイトル]] が出現する回数の合計(自分自身は除く)。
    // getBacklinkNotes と同じ「他ノートの本文をパースして参照を探す」考え方を使うが、
    // ノート単位ではなく出現回数そのものを数える(サジェストの並び順に使う)。
    function getCitationCount(note, allNotes) {
      let count = 0;
      allNotes.forEach((other) => {
        if (other.id === note.id) {
          return;
        }
        count += extractLinkTitles(other.body).filter((title) => title === note.title.trim()).length;
      });
      return count;
    }

    function extractTags(text) {
      const pattern = /::(.+?)::/g;
      const tags = [];
      let match;
      while ((match = pattern.exec(text)) !== null) {
        const trimmed = match[1].trim();
        if (trimmed !== '') {
          tags.push(trimmed);
        }
      }
      return tags;
    }

    function getAllTagsWithCounts(allNotes) {
      const counts = new Map();
      allNotes.forEach((note) => {
        const tagsInNote = new Set(extractTags(note.body));
        tagsInNote.forEach((tag) => {
          counts.set(tag, (counts.get(tag) || 0) + 1);
        });
      });
      return [...counts.entries()]
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => b.count - a.count);
    }

    function filterNotesByTags(notesToFilter, selectedTagNames) {
      if (selectedTagNames.length === 0) {
        return notesToFilter;
      }
      return notesToFilter.filter((note) => {
        const noteTags = new Set(extractTags(note.body));
        return selectedTagNames.every((tag) => noteTags.has(tag));
      });
    }

    // --- ノート俯瞰モーダル用の純粋関数 -------------------------------

    function getRecentNotes(notesToSearch, n) {
      return sortByUpdatedDesc(notesToSearch).slice(0, n); // 既存の sortByUpdatedDesc を再利用
    }

    // 引用数(getCitationCountと同じ「出現回数」ベースの考え方)の多い順に上位n件。
    // 比較のたびに引用数を数え直すと無駄が多いため、先に1回だけ集計してから並べ替える。
    function getHubNotes(notesToSearch, n) {
      const counted = notesToSearch.map((note) => ({ note, count: getCitationCount(note, notesToSearch) }));
      counted.sort((a, b) => b.count - a.count);
      return counted.slice(0, n).map((entry) => entry.note);
    }

    // 指定タグを持つノートを、指定ノート(ハブノート自身)を除いて更新日順で上位n件。
    function getNotesWithTagExcept(tagName, allNotes, excludeNoteId, n) {
      const withTag = allNotes.filter((note) => note.id !== excludeNoteId && extractTags(note.body).includes(tagName));
      return sortByUpdatedDesc(withTag).slice(0, n);
    }

    // タグを共有しているがリンクしていない(どちらの方向にも[[]]で参照していない)
    // ノートのペアを、共有タグ数が多い順に上位n組返す。
    // タグ集合・リンク先集合はペアごとに数え直すと無駄が多いため先に1回だけ計算する。
    function getPotentialLinkPairs(allNotes, n) {
      const tagSets = new Map(allNotes.map((note) => [note.id, new Set(extractTags(note.body))]));
      const outgoingIdSets = new Map(allNotes.map((note) => [note.id, new Set(getOutgoingNotes(note, allNotes).map((t) => t.id))]));
      const pairs = [];
      for (let i = 0; i < allNotes.length; i += 1) {
        for (let j = i + 1; j < allNotes.length; j += 1) {
          const a = allNotes[i];
          const b = allNotes[j];
          const sharedTags = [...tagSets.get(a.id)].filter((tag) => tagSets.get(b.id).has(tag));
          if (sharedTags.length === 0) {
            continue;
          }
          const alreadyLinked = outgoingIdSets.get(a.id).has(b.id) || outgoingIdSets.get(b.id).has(a.id);
          if (alreadyLinked) {
            continue;
          }
          pairs.push({ noteA: a, noteB: b, sharedTags });
        }
      }
      return pairs.sort((x, y) => y.sharedTags.length - x.sharedTags.length).slice(0, n);
    }

    // 参照されておらず、参照もしていないノート(既存の getOutgoingNotes / getBacklinkNotes を再利用)。
    function getIsolatedNotes(allNotes) {
      return allNotes.filter((note) => getOutgoingNotes(note, allNotes).length === 0 && getBacklinkNotes(note, allNotes).length === 0);
    }

    // 統計セクション用: 全ノートの本文中の [[]] のうち、実在ノートを指しているものの総数。
    function countValidLinks(allNotes) {
      let count = 0;
      allNotes.forEach((note) => {
        count += extractLinkTitles(note.body).filter((title) => findNoteByTitle(title, allNotes)).length;
      });
      return count;
    }

    // 「2時間前」「昨日」「3日前」のような相対時間表記。1週間以上前は既存の
    // formatDateTime にフォールバックする。
    function formatRelativeTime(timestamp) {
      const diffMs = Date.now() - timestamp;
      const diffMinutes = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      if (diffMinutes < 1) {
        return 'たった今';
      }
      if (diffMinutes < 60) {
        return `${diffMinutes}分前`;
      }
      if (diffHours < 24) {
        return `${diffHours}時間前`;
      }
      if (diffDays === 1) {
        return '昨日';
      }
      if (diffDays < 7) {
        return `${diffDays}日前`;
      }
      return formatDateTime(timestamp);
    }

    // --- 共通 -----------------------------------------------------

    function showView(viewName) {
      const showList = viewName === 'list';
      listView.hidden = !showList;
      editorView.hidden = showList;
    }

    function announce(message) {
      // 直前と同じ文言でも読み上げられるよう、一度空にしてから設定する
      liveRegion.textContent = '';
      window.setTimeout(() => {
        liveRegion.textContent = message;
      }, 50);
    }

    function formatDateTime(timestamp) {
      const date = new Date(timestamp);
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // --- 一覧画面 ---------------------------------------------------

    function getVisibleNotes() {
      const filtered = filterNotesByTags(notes, selectedTags);
      return sortByUpdatedDesc(filtered);
    }

    function renderNoteList() {
      const visible = getVisibleNotes();
      noteListEl.innerHTML = '';

      visible.forEach((note) => {
        const titleText = note.title.trim() === '' ? '無題' : note.title;

        const li = document.createElement('li');
        li.className = 'note-item';

        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'note-open-btn';
        openBtn.dataset.id = note.id;

        const titleSpan = document.createElement('span');
        titleSpan.className = 'note-title';
        titleSpan.textContent = titleText;

        const updatedSpan = document.createElement('span');
        updatedSpan.className = 'note-updated';
        updatedSpan.textContent = `更新: ${formatDateTime(note.updatedAt)}`;

        openBtn.appendChild(titleSpan);
        openBtn.appendChild(updatedSpan);

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'note-delete-btn';
        deleteBtn.dataset.id = note.id;
        deleteBtn.setAttribute('aria-label', `「${titleText}」を削除`);
        deleteBtn.textContent = '削除';

        li.appendChild(openBtn);
        li.appendChild(deleteBtn);
        noteListEl.appendChild(li);
      });
    }

    function renderTagList() {
      const tagsWithCounts = getAllTagsWithCounts(notes);
      const availableTagNames = tagsWithCounts.map((t) => t.name);

      // ノートの編集・削除でノート側から消えたタグは選択状態からも外す
      selectedTags = selectedTags.filter((t) => availableTagNames.includes(t));

      tagListEl.innerHTML = '';
      tagsWithCounts.forEach(({ name, count }) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tag-btn';
        btn.dataset.name = name;
        const isSelected = selectedTags.includes(name);
        btn.setAttribute('aria-pressed', String(isSelected));
        if (isSelected) {
          btn.classList.add('tag-btn-selected');
        }
        btn.textContent = `${name} (${count})`;
        btn.addEventListener('click', () => toggleTag(name));
        li.appendChild(btn);
        tagListEl.appendChild(li);
      });
    }

    function focusTagButton(name) {
      const btn = tagListEl.querySelector(`.tag-btn[data-name="${CSS.escape(name)}"]`);
      if (btn) {
        btn.focus();
      }
    }

    function announceFilterState() {
      if (selectedTags.length === 0) {
        announce(`絞り込みを解除しました、${notes.length}件`);
        return;
      }
      const visibleCount = getVisibleNotes().length;
      announce(`${selectedTags.join('と')}で絞り込み中、${visibleCount}件`);
    }

    function toggleTag(name) {
      const index = selectedTags.indexOf(name);
      if (index === -1) {
        selectedTags.push(name);
      } else {
        selectedTags.splice(index, 1);
      }
      renderTagList();
      renderNoteList();
      focusTagButton(name);
      announceFilterState();
    }

    function renderListView() {
      renderTagList();
      renderNoteList();
    }

    function focusFirstListItem() {
      const firstBtn = noteListEl.querySelector('.note-open-btn');
      if (firstBtn) {
        firstBtn.focus();
      } else {
        newNoteBtn.focus();
      }
    }

    function focusListItem(noteId) {
      const btn = noteListEl.querySelector(`.note-open-btn[data-id="${noteId}"]`);
      if (btn) {
        btn.focus();
      } else {
        focusFirstListItem();
      }
    }

    function focusAfterDelete(deletedIndex) {
      const items = noteListEl.querySelectorAll('.note-open-btn');
      if (items.length === 0) {
        newNoteBtn.focus();
        return;
      }
      const targetIndex = Math.min(deletedIndex, items.length - 1);
      items[targetIndex].focus();
    }

    function handleNewNoteClick() {
      const newNote = {
        id: crypto.randomUUID(),
        title: '',
        body: '',
        updatedAt: Date.now(),
      };
      notes.push(newNote);
      saveNotes(notes);
      rebuildSuggestionSources();
      renderListView();
      openEditor(newNote.id);
    }

    function handleDeleteClick(noteId) {
      const note = notes.find((n) => n.id === noteId);
      if (!note) {
        return;
      }
      const titleText = note.title.trim() === '' ? '無題' : note.title;
      deleteTargetId = noteId;
      deleteMessageEl.textContent = `「${titleText}」を削除します。この操作は元に戻せません。`;
      deleteDialog.showModal();
    }

    function handleConfirmDelete() {
      const visible = getVisibleNotes();
      const deletedIndex = visible.findIndex((n) => n.id === deleteTargetId);
      const deletedNote = visible[deletedIndex];

      deleteDialog.close();

      notes = notes.filter((n) => n.id !== deleteTargetId);
      saveNotes(notes);
      rebuildSuggestionSources();
      renderListView();
      focusAfterDelete(deletedIndex);
      announce(`「${deletedNote.title.trim() === '' ? '無題' : deletedNote.title}」を削除しました`);
    }

    // --- ノート俯瞰モーダル ---------------------------------------------

    // 俯瞰モーダル内のノート名ボタンを作る共通ヘルパー。既存の createNoteLinkButton は
    // 編集画面専用でモーダルを閉じる処理を持たないため、別関数として持つ
    // (どちらも .note-link クラスを使い見た目は統一する)。
    function createOverviewNoteButton(note, extraLabel) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'note-link';
      const titleText = note.title.trim() === '' ? '無題' : note.title;
      btn.textContent = extraLabel ? `${titleText}${extraLabel}` : titleText;
      btn.setAttribute('aria-label', `${titleText}を開く`);
      btn.addEventListener('click', () => {
        overviewDialog.close();
        openEditor(note.id);
      });
      return btn;
    }

    function renderOverviewStats() {
      const linkCount = countValidLinks(notes);
      const tagCount = getAllTagsWithCounts(notes).length; // 既存関数を再利用
      overviewStatsText.textContent = `全体: 合計${notes.length}ノート、${linkCount}リンク、${tagCount}タグ`;
    }

    function renderOverviewRecent() {
      overviewRecentList.innerHTML = '';
      getRecentNotes(notes, 3).forEach((note) => {
        const li = document.createElement('li');
        li.appendChild(createOverviewNoteButton(note, ` (${formatRelativeTime(note.updatedAt)})`));
        overviewRecentList.appendChild(li);
      });
    }

    // 見出し + ノート一覧(更新日順、最大5件、超えた分は「他N件」)を container に追加する。
    function appendOverviewNoteCluster(container, headingText, clusterNotes) {
      const heading = document.createElement('p');
      heading.textContent = headingText;
      container.appendChild(heading);

      const ul = document.createElement('ul');
      sortByUpdatedDesc(clusterNotes).slice(0, 5).forEach((related) => {
        const li = document.createElement('li');
        li.appendChild(createOverviewNoteButton(related));
        ul.appendChild(li);
      });
      container.appendChild(ul);

      if (clusterNotes.length > 5) {
        const more = document.createElement('p');
        more.textContent = `他${clusterNotes.length - 5}件`;
        container.appendChild(more);
      }
    }

    function renderOverviewHubs() {
      overviewHubsContainer.innerHTML = '';
      const hubs = getHubNotes(notes, 3).filter((note) => getCitationCount(note, notes) > 0);
      if (hubs.length === 0) {
        const p = document.createElement('p');
        p.textContent = 'ハブノートはありません';
        overviewHubsContainer.appendChild(p);
        return;
      }
      hubs.forEach((note) => {
        const citationCount = getCitationCount(note, notes);

        // <summary> の中に <button> を入れ子にすると、一部のスクリーンリーダーで
        // ネストした対話的要素の扱いが不安定になるため避ける。ノートを開くボタンと
        // 折りたたみ用の <details> を横に並べ、CSSで1行に見えるようにする。
        const row = document.createElement('div');
        row.className = 'hub-note';

        row.appendChild(createOverviewNoteButton(note));

        const details = document.createElement('details');
        details.open = false;
        const summary = document.createElement('summary');
        summary.textContent = `${citationCount}件から参照`;
        details.appendChild(summary);

        // ハブノートを参照しているノート(backlinks)だけを対象に、ハブと共有するタグで
        // クラスタリングして表示する。参照先(そのハブが参照しているノート)は表示しない。
        const backlinks = getBacklinkNotes(note, notes);
        if (backlinks.length === 0) {
          const p = document.createElement('p');
          p.textContent = '参照元はありません';
          details.appendChild(p);
        } else {
          const hubTags = [...new Set(extractTags(note.body))];
          const noSharedTag = [];
          const clustersByTag = new Map();
          backlinks.forEach((related) => {
            const relatedTags = new Set(extractTags(related.body));
            const sharedTags = hubTags.filter((tag) => relatedTags.has(tag));
            if (sharedTags.length === 0) {
              noSharedTag.push(related);
            } else {
              sharedTags.forEach((tag) => {
                if (!clustersByTag.has(tag)) {
                  clustersByTag.set(tag, []);
                }
                clustersByTag.get(tag).push(related);
              });
            }
          });

          hubTags.forEach((tag) => {
            const cluster = clustersByTag.get(tag);
            if (!cluster) {
              return;
            }
            appendOverviewNoteCluster(details, `タグ「${tag}」を共有する参照元 (${cluster.length}件)`, cluster);
          });
          if (noSharedTag.length > 0) {
            appendOverviewNoteCluster(details, `タグを共有しない参照元 (${noSharedTag.length}件)`, noSharedTag);
          }
        }

        row.appendChild(details);
        overviewHubsContainer.appendChild(row);
      });
    }

    function renderOverviewPotentialLinks() {
      overviewPotentialList.innerHTML = '';
      const pairs = getPotentialLinkPairs(notes, 3);
      if (pairs.length === 0) {
        const li = document.createElement('li');
        li.textContent = '潜在リンク候補はありません';
        overviewPotentialList.appendChild(li);
        return;
      }
      pairs.forEach(({ noteA, noteB, sharedTags }) => {
        const li = document.createElement('li');
        li.appendChild(createOverviewNoteButton(noteA));
        li.appendChild(document.createTextNode(' ⇔ '));
        li.appendChild(createOverviewNoteButton(noteB));
        const tagsSpan = document.createElement('span');
        tagsSpan.textContent = ` (共通タグ: ${sharedTags.join('、')})`;
        li.appendChild(tagsSpan);
        overviewPotentialList.appendChild(li);
      });
    }

    function renderOverviewIsolated() {
      const isolated = getIsolatedNotes(notes);
      overviewIsolatedList.innerHTML = '';
      if (isolated.length === 0) {
        overviewIsolatedCount.textContent = '孤立ノートはありません';
        return;
      }
      overviewIsolatedCount.textContent = `孤立ノート: ${isolated.length}件`;
      sortByUpdatedDesc(isolated).slice(0, 5).forEach((note) => {
        const li = document.createElement('li');
        li.appendChild(createOverviewNoteButton(note));
        overviewIsolatedList.appendChild(li);
      });
    }

    function renderOverviewModal() {
      renderOverviewStats();
      renderOverviewRecent();
      renderOverviewHubs();
      renderOverviewPotentialLinks();
      renderOverviewIsolated();
    }

    function openOverviewModal() {
      renderOverviewModal();
      overviewDialog.showModal();
      announce('ノート俯瞰を表示しました');
    }

    // --- 編集画面 ---------------------------------------------------

    function createNoteLinkButton(note) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'note-link';
      btn.textContent = note.title.trim() === '' ? '無題' : note.title;
      btn.addEventListener('click', () => openEditor(note.id));
      li.appendChild(btn);
      return li;
    }

    function renderRelatedNotes() {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note) {
        return;
      }

      const outgoing = getOutgoingNotes(note, notes);
      outgoingListEl.innerHTML = '';
      outgoing.forEach((n) => outgoingListEl.appendChild(createNoteLinkButton(n)));
      outgoingDetails.hidden = outgoing.length === 0;
      outgoingDetails.querySelector('summary').textContent = `参照しているノート (${outgoing.length})`;

      const backlinks = getBacklinkNotes(note, notes);
      backlinksListEl.innerHTML = '';
      backlinks.forEach((n) => backlinksListEl.appendChild(createNoteLinkButton(n)));
      backlinksDetails.hidden = backlinks.length === 0;
      backlinksDetails.querySelector('summary').textContent = `参照されているノート(backlinks) (${backlinks.length})`;

      relatedEmptyMessage.hidden = outgoing.length > 0 || backlinks.length > 0;
    }

    function resolveDuplicateTitle(noteId) {
      const note = notes.find((n) => n.id === noteId);
      if (!note) {
        return false;
      }

      const trimmedTitle = note.title.trim();
      const baseTitle = trimmedTitle === '' ? '無題' : trimmedTitle;
      const isDuplicate = notes.some((n) => n.id !== note.id && n.title.trim() === baseTitle);

      // タイトルが空でなく、かつ重複もなければ何もしない
      if (trimmedTitle !== '' && !isDuplicate) {
        return false;
      }

      let finalTitle = baseTitle;
      if (isDuplicate) {
        let counter = 1;
        let candidate;
        do {
          candidate = `${baseTitle}_${String(counter).padStart(2, '0')}`;
          counter += 1;
        } while (notes.some((n) => n.id !== note.id && n.title.trim() === candidate));
        finalTitle = candidate;
      }

      note.title = finalTitle;
      note.updatedAt = Date.now();
      saveNotes(notes);
      rebuildSuggestionSources();
      if (noteId === currentNoteId) {
        titleInput.value = finalTitle;
        renderRelatedNotes();
      }
      announce(isDuplicate
        ? `タイトルが重複していたため「${finalTitle}」に設定しました`
        : `タイトルを「${finalTitle}」に設定しました`);
      return true;
    }

    function openEditor(noteId) {
      const note = notes.find((n) => n.id === noteId);
      if (!note) {
        return;
      }
      if (currentNoteId && currentNoteId !== noteId) {
        resolveDuplicateTitle(currentNoteId);
      }
      currentNoteId = noteId;
      titleInput.value = note.title;
      setBodyContent(note.body);
      renderRelatedNotes();
      showView('editor');
      titleInput.focus();
    }

    function closeEditor() {
      const noteId = currentNoteId;
      resolveDuplicateTitle(noteId);
      currentNoteId = null;
      renderListView();
      showView('list');
      focusListItem(noteId);
    }

    function handleEditorInput() {
      const note = notes.find((n) => n.id === currentNoteId);
      if (!note) {
        return;
      }
      note.title = titleInput.value;
      note.body = bodyView.state.doc.toString();
      note.updatedAt = Date.now();
      saveNotes(notes);
      rebuildSuggestionSources();
      renderRelatedNotes();
    }

    function handleExplicitSave() {
      handleEditorInput();
      const renamed = resolveDuplicateTitle(currentNoteId);
      if (!renamed) {
        announce('保存しました');
      }
    }

    // --- イベント登録 -------------------------------------------------

    newNoteBtn.addEventListener('click', handleNewNoteClick);
    backBtn.addEventListener('click', closeEditor);
    clearTagsBtn.addEventListener('click', () => {
      selectedTags = [];
      renderTagList();
      renderNoteList();
      announceFilterState();
    });
    titleInput.addEventListener('input', handleEditorInput);
    // 本文側の入力検知は bodyExtensions 内の EditorView.updateListener が担う

    noteListEl.addEventListener('click', (event) => {
      const openBtn = event.target.closest('.note-open-btn');
      if (openBtn) {
        openEditor(openBtn.dataset.id);
        return;
      }
      const deleteBtn = event.target.closest('.note-delete-btn');
      if (deleteBtn) {
        handleDeleteClick(deleteBtn.dataset.id);
      }
    });

    deleteCancelBtn.addEventListener('click', () => {
      deleteDialog.close();
    });
    deleteConfirmBtn.addEventListener('click', handleConfirmDelete);
    deleteDialog.addEventListener('close', () => {
      deleteTargetId = null;
    });

    overviewOpenBtn.addEventListener('click', openOverviewModal);
    overviewCloseBtn.addEventListener('click', () => {
      overviewDialog.close();
    });

    document.addEventListener('keydown', (event) => {
      if (deleteDialog.open || overviewDialog.open) {
        // ダイアログ表示中は <dialog> 標準のフォーカストラップ・Escape挙動に任せる
        return;
      }
      if (event.key === 'Escape' && completionStatus(bodyView.state) != null) {
        // 候補ポップアップ表示中の Escape は CodeMirror 側の closeCompletion に任せ、
        // 編集画面ごと閉じてしまわないようにする
        return;
      }
      if (event.key === 'Escape' && !editorView.hidden) {
        closeEditor();
      } else if (event.ctrlKey && event.key.toLowerCase() === 's') {
        if (!editorView.hidden) {
          event.preventDefault();
          handleExplicitSave();
        }
      } else if (event.key === '?' && !listView.hidden && editorView.hidden) {
        // Shift+/ (多くのキーボード配列では "?" として送られる) で俯瞰モーダルを開く
        event.preventDefault();
        openOverviewModal();
      }
    });

    // --- 初期化 ---------------------------------------------------

    function init() {
      notes = loadNotes();
      rebuildSuggestionSources();
      renderListView();
      focusFirstListItem();
    }

    init();
  </script>
</body>
</html>
